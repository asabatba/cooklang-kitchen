    <div x-show="planOpen" x-cloak class="fixed inset-0 z-50 flex flex-col bg-stone-50 dark:bg-[#110d08]">
      <div class="flex flex-wrap items-center gap-3 border-b border-amber-200/60 bg-white/90 px-4 py-3 backdrop-blur dark:border-[#2e2416] dark:bg-[#0f0b07]/90">
        <h2 class="font-serif text-lg font-semibold">Meal Plan</h2>
        <div class="flex items-center gap-2 text-sm">
          <button type="button" @click="changePlanWeek(-7)" class="rounded-lg border border-amber-200 bg-white px-2.5 py-1.5 shadow-sm transition hover:bg-amber-50 dark:border-[#3a2e1c] dark:bg-[#1e1810] dark:hover:bg-[#261e12]">‹</button>
          <span class="min-w-[11rem] text-center text-stone-600 dark:text-stone-300" x-text="planWeekLabel"></span>
          <button type="button" @click="changePlanWeek(7)" class="rounded-lg border border-amber-200 bg-white px-2.5 py-1.5 shadow-sm transition hover:bg-amber-50 dark:border-[#3a2e1c] dark:bg-[#1e1810] dark:hover:bg-[#261e12]">›</button>
          <button type="button" @click="goToCurrentWeek()" class="rounded-lg border border-amber-200 bg-white px-2.5 py-1.5 text-xs shadow-sm transition hover:bg-amber-50 dark:border-[#3a2e1c] dark:bg-[#1e1810] dark:hover:bg-[#261e12]">Today</button>
        </div>
        <button type="button" x-show="adminMode" x-cloak @click="addWeekToShoppingList()" class="rounded-lg border border-emerald-600 bg-emerald-600 px-3 py-1.5 text-sm font-medium text-white shadow-sm transition hover:bg-emerald-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/70">Add week to shopping list</button>
        <button type="button" @click="closePlanOverlay()" class="ml-auto rounded-md border border-stone-200 bg-stone-50 px-2 py-0.5 text-stone-500 transition hover:bg-stone-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-500/60 dark:border-[#3a2e1c] dark:bg-[#261e12] dark:text-stone-400 dark:hover:bg-[#332516]">&times;</button>
      </div>

      <div class="flex-1 overflow-auto p-3">
        <template x-if="planLoading">
          <p class="p-4 text-sm text-stone-400 dark:text-stone-600">Loading…</p>
        </template>
        <template x-if="!planLoading">
          <div class="grid min-w-[720px] grid-cols-7 gap-2">
            <template x-for="date in currentWeekDates" :key="date">
              <div class="rounded-xl border border-amber-200/60 bg-white/70 dark:border-[#2e2416] dark:bg-[#160f09]/70" :class="isToday(date) ? 'ring-2 ring-amber-500/60' : ''">
                <div class="border-b border-amber-100 px-2 py-1.5 text-center dark:border-[#2a1e10]">
                  <p class="text-[10px] font-semibold uppercase tracking-widest text-stone-400 dark:text-stone-600" x-text="formatPlanDate(date).weekday"></p>
                  <p class="text-sm font-medium" x-text="formatPlanDate(date).display"></p>
                </div>
                <template x-for="slot in ['lunch', 'dinner']" :key="slot">
                  <div class="border-b border-amber-100/60 p-2 last:border-b-0 dark:border-[#2a1e10]/60">
                    <p class="mb-1 text-[9px] font-semibold uppercase tracking-widest text-stone-400 dark:text-stone-600" x-text="slot"></p>
                    <template x-if="planRecipeFor(date, slot)">
                      <div class="rounded-lg border border-amber-200/70 bg-amber-50/60 p-2 text-xs dark:border-[#3a2e1c] dark:bg-[#1e1810]">
                        <button type="button" class="block w-full truncate text-left font-medium focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-500/50" @click="planOpen = false; loadActiveRecipe(planRecipeFor(date, slot).id)" x-text="planRecipeFor(date, slot).title"></button>
                        <div x-show="adminMode" x-cloak class="mt-1 flex gap-2">
                          <button type="button" class="text-[10px] text-stone-500 underline dark:text-stone-400" @click="openPlanPicker(date, slot)">Change</button>
                          <button type="button" class="text-[10px] text-red-500 underline dark:text-red-400" @click="clearPlanSlot(date, slot)">Clear</button>
                        </div>
                      </div>
                    </template>
                    <template x-if="!planRecipeFor(date, slot) && adminMode">
                      <button type="button" @click="openPlanPicker(date, slot)" class="flex h-12 w-full items-center justify-center rounded-lg border border-dashed border-amber-300/60 text-stone-400 transition hover:border-amber-500 hover:text-amber-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-500/50 dark:border-[#3a2e1c] dark:text-stone-600">+</button>
                    </template>
                    <template x-if="!planRecipeFor(date, slot) && !adminMode">
                      <p class="flex h-12 items-center justify-center text-xs text-stone-300 dark:text-stone-700">—</p>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>
      </div>

      <div x-show="planPicker.date" x-cloak @click.self="closePlanPicker()" class="fixed inset-0 z-[60] grid place-items-center bg-stone-950/50 p-4 backdrop-blur-sm dark:bg-black/65">
        <div class="w-full max-w-md rounded-2xl border border-amber-200/50 bg-white shadow-2xl dark:border-[#3a2e1c] dark:bg-[#1a1510]">
          <div class="flex items-center justify-between border-b border-amber-100 p-4 dark:border-[#2e2416]">
            <h2 class="font-serif text-lg font-semibold">Pick a recipe</h2>
            <button type="button" @click="closePlanPicker()" class="rounded-md border border-stone-200 bg-stone-50 px-2 py-0.5 text-stone-500 transition hover:bg-stone-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-500/60 dark:border-[#3a2e1c] dark:bg-[#261e12] dark:text-stone-400 dark:hover:bg-[#332516]">&times;</button>
          </div>
          <div class="p-4">
            <input x-model.debounce.200ms="planPicker.search" type="text" placeholder="Search recipes…" class="w-full rounded-xl border border-amber-200/80 bg-stone-50 px-3 py-2 text-sm text-stone-800 shadow-sm placeholder:text-stone-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-500/60 dark:border-[#3a2e1c] dark:bg-[#120e09] dark:text-stone-100 dark:placeholder:text-stone-600">
          </div>
          <div class="max-h-80 overflow-y-auto border-t border-amber-100 dark:border-[#2e2416]">
            <template x-for="recipe in planPickerResults" :key="recipe.id">
              <button type="button" @click="assignPlanSlot(recipe.id)" class="block w-full truncate px-4 py-2 text-left text-sm transition hover:bg-amber-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-500/50 dark:hover:bg-[#1e1810]" x-text="recipe.title"></button>
            </template>
            <p x-show="planPickerResults.length === 0" class="px-4 py-3 text-sm text-stone-400 dark:text-stone-600">No recipes match.</p>
          </div>
        </div>
      </div>
    </div>
