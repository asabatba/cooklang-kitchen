      <aside :class="ui.sidebarOpen ? 'translate-x-0' : '-translate-x-full xl:translate-x-0'" class="fixed left-0 top-[58px] z-40 h-[calc(100vh-58px)] w-[320px] border-r border-amber-200/60 bg-white/85 shadow-xl shadow-amber-100/30 backdrop-blur-xl transition-transform duration-300 dark:border-[#2e2416] dark:bg-[#0f0b07]/90 dark:shadow-black/30 xl:sticky xl:translate-x-0">
        <div class="sticky top-0 border-b border-amber-200/60 bg-white/95 p-3 backdrop-blur dark:border-[#2e2416] dark:bg-[#120e09]/95">
          <h2 class="text-[10px] font-semibold uppercase tracking-[0.22em] text-stone-400 dark:text-stone-500">Recipes</h2>
          <input x-model.debounce.200ms="searchFilter" type="text" placeholder="Search recipes…" class="mt-2 w-full rounded-xl border border-amber-200/80 bg-stone-50 px-3 py-2 text-sm text-stone-800 shadow-sm placeholder:text-stone-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-500/60 dark:border-[#3a2e1c] dark:bg-[#1a1510] dark:text-stone-100 dark:placeholder:text-stone-600">
          <button type="button" x-show="adminMode" x-cloak @click="openNewRecipe()" class="mt-2 w-full rounded-xl border border-amber-600 bg-amber-600 px-3 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-amber-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-500/70">+ Add Recipe</button>
          <button type="button" x-show="adminMode" x-cloak @click="openTranslationsAdmin()" class="mt-2 w-full rounded-xl border border-emerald-600 bg-emerald-600 px-3 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-emerald-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500/70">Update Translations</button>
        </div>
        <div class="h-[calc(100%-109px)] overflow-y-auto py-2">
          <template x-if="filteredRecipesByCategory.length === 0">
            <p class="px-3 py-4 text-sm text-stone-500 dark:text-stone-500">No recipes found.</p>
          </template>
          <template x-for="[category, items] in filteredRecipesByCategory" :key="category">
            <section class="mb-3">
              <h3 class="px-3 pb-1 pt-2 text-[10px] font-semibold uppercase tracking-[0.22em] text-stone-400 dark:text-stone-600" x-text="category"></h3>
              <template x-for="recipe in items" :key="recipe.id">
                <article class="mx-2 mt-1 flex gap-2.5 rounded-xl border border-transparent bg-transparent p-2.5 transition-all duration-150 hover:border-amber-200 hover:bg-amber-50/60 dark:hover:border-[#3a2e1c] dark:hover:bg-[#1e1810]" :class="recipe.id === activeId ? 'border-amber-300/80 bg-amber-50/80 dark:border-[#5a3e20] dark:bg-[#241c10]' : ''">
                  <button type="button" @click.stop="toggleSelect(recipe.id)" class="mt-0.5 h-4 w-4 flex-shrink-0 rounded border border-amber-300/80 text-[10px] text-amber-700 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-500/60 dark:border-[#4a3a20] dark:text-stone-400" :class="isSelected(recipe.id) ? 'border-emerald-600 bg-emerald-600 text-white dark:border-emerald-600 dark:bg-emerald-600 dark:text-white' : ''">✓</button>
                  <button type="button" @click="loadActiveRecipe(recipe.id)" class="min-w-0 flex-1 rounded text-left focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-500/50">
                    <p class="truncate text-sm font-medium leading-snug" x-text="recipe.title"></p>
                    <p class="truncate text-xs leading-snug text-stone-400 dark:text-stone-600" x-text="recipe.description || ''"></p>
                  </button>
                </article>
              </template>
            </section>
          </template>
        </div>
      </aside>
