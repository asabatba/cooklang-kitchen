[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cooklang-kitchen"
version = "0.1.0"
description = "Cooklang recipe viewer and editor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Flask==3.1.3",
  "Werkzeug==3.1.3",
  "gunicorn==23.0.0",
]

[project.scripts]
cooklang-kitchen = "cooklang_kitchen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
